# Triggerbot detection
#
# A check captures a short, bounded sample only after staff run the command.
# The result is an investigation lead. This module never punishes automatically.

sampling:
  duration-seconds: 5
  # Two ticks is ten samples per second on a normally running server.
  interval-ticks: 2
  opponent-radius: 12.0
  max-opponents: 2
  max-frames: 60
  max-attacks: 64
  minimum-frames: 10
  max-concurrent-checks: 4

# Jev receives the entire state below as one score question. The wording is
# deliberately explicit about ping so network delay is not mistaken for intent.
question:
  id: triggerbot_score
  type: score
  instructions: >-
    Rate from 0 to 100 how strongly this five second Minecraft combat sample
    supports a triggerbot or other automated attack pattern. Account for the
    player's ping in every timing judgment, and consider movement, target
    movement, aim changes, attack intervals, health, velocity, view angle and
    target switching together. A skilled player, low ping, high click rate or
    a single close hit is not evidence of automation. Look for repeated timing
    regularity, implausible reaction timing after ping is accounted for,
    unnatural rotation changes and attacks that consistently occur without
    human variation. A high score is an investigation lead, not proof.
  criteria:
    - range: '0-24'
      meaning: 'The sample is consistent with ordinary play.'
    - range: '25-49'
      meaning: 'There are weak or mixed automation signals.'
    - range: '50-74'
      meaning: 'The sample contains several suspicious patterns.'
    - range: '75-100'
      meaning: 'The sample strongly supports automated aiming or clicking.'

report-threshold: 70.0

# Triggerbot detection
#
# A check captures a short, bounded sample only after staff run the command.
# The result is an investigation lead. This module never punishes automatically.

sampling:
  duration-seconds: 5
  # Two ticks is ten samples per second on a normally running server.
  interval-ticks: 2
  opponent-radius: 12.0
  max-opponents: 2
  max-frames: 60
  max-attacks: 64
  minimum-frames: 10
  max-concurrent-checks: 4

# Jev receives the entire state below as one score question. The wording is
# deliberately explicit about ping so network delay is not mistaken for intent.
question:
  id: triggerbot_score
  type: score
  instructions: >-
    Rate this five second Minecraft combat sample across the ordered levels
    from ordinary play to exceptional evidence of a triggerbot or other
    automated attack pattern. Account for the player's ping in every timing
    judgment, and consider movement, target movement, aim changes, attack
    intervals, health, velocity, view angle and target switching together. A
    skilled player, low ping, high click rate or a single close hit is not
    evidence of automation. Look for repeated timing regularity, implausible
    reaction timing after ping is accounted for, unnatural rotation changes and
    attacks that consistently occur without human variation. The plugin maps
    the selected level to a 0 to 100 display score. A high score is an
    investigation lead, not proof.
  criteria:
    - 'Normal. The sample is consistent with ordinary play.'
    - 'Weak or mixed. There are some automation-like signals, but nothing conclusive.'
    - 'Suspicious. The sample contains several repeated automation-like patterns.'
    - 'Strong. The sample strongly supports automated aiming or clicking.'
    - 'Extreme. The sample is exceptionally consistent with automation after ping is considered.'

report-threshold: 70.0
